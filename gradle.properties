# Gradle daemon
org.gradle.jvmargs=-Xmx6G
org.gradle.parallel=true
org.gradle.caching=true

# ============================================================================
# Toolchain
# ============================================================================
# Pinned to 1.7.x: Loom 1.8+ requires Gradle 9.5, which is incompatible with the
# rest of this toolchain. Bumping loom requires simultaneously bumping Gradle
# wrapper, java toolchain, and likely several deps built with older looms.
loom_version=1.7.+

# ============================================================================
# Mod metadata
# ============================================================================
mod_version = 0.9.5
displayed_mc_versions = 1.21-1.21.1
maven_group = com.simibubi_port.create

# ============================================================================
# Minecraft / Fabric (target: 1.21-1.21.1)
#   ref: https://fabricmc.net/develop
# ============================================================================
minecraft_version = 1.21
minecraft_dependency = 1.21
loader_version = 0.19.3
fabric_version = 0.102.0+1.21

# Mappings (quilt-mappings; unused but referenced by build.gradle)
#   ref: https://lambdaurora.dev/tools/import_quilt.html
qm_version = 6

mixin_extras_version = 0.5.0-beta.3

# ============================================================================
# Compile/runtime dependencies
# ============================================================================

# Forge Config API Port - https://modrinth.com/mod/forge-config-api-port/versions
forge_config_api_port_version = 21.1.6

# Night Config - https://github.com/TheElectronWill/night-config/releases
night_config_version = 3.9.0

# JSR305 annotations
jsr305_version = 3.0.2

# ----------------------------------------------------------------------------
# Recipe viewers / compat mods (modCompileOnly)
# ----------------------------------------------------------------------------

# JEI 1.21.1-fabric (Maven only - maven.blamejared.com/mezz/jei/jei-1.21.1-fabric)
# Note: jei-1.21-fabric stops at 19.8.x on blamejared; jei-1.21.1-fabric has 19.39.x
#   ref: https://modrinth.com/mod/jei/versions
jei_version = 19.39.0.368

# Mod Menu - https://modrinth.com/mod/modmenu/versions
modmenu_version = 11.0.4

# Sodium - https://modrinth.com/mod/sodium
# PINNED: 0.6.x stable and later use Loom 1.8+, which requires Gradle 9.
# This beta.1 build is the last one built with Loom 1.7.3.
sodium_version = mc1.21-0.6.0-beta.1-fabric

# Lithium (declared but not currently compiled against)
# - https://modrinth.com/mod/lithium/versions
lithium_version = mc1.21.1-0.15.2-fabric

# Indium - https://modrinth.com/mod/indium/versions
indium_version = 1.0.35+mc1.21

# Iris - https://modrinth.com/mod/iris/versions
# PINNED: 1.8.9+ was built with Loom 1.8.9; 1.8.14-beta.1+ with Loom 1.16.3.
# 1.8.8 is the last release built with Loom 1.7.3.
iris_version = 1.8.8+1.21.1-fabric

frex_version = 20.5.369

# https://modrinth.com/mod/cobblemon
cobblemon_version = 1.7.3+1.21.1

# ============================================================================
# Dev-only configuration
# ============================================================================

# Recipe viewer in dev: 'emi', 'rei', or 'jei'. Don't push changes to this.
recipe_viewer = emi

# Comma-separated list of test mods to enable in dev. 'none' to use none.
test_mods = none
